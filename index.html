<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démineur</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #222;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #111;
    }

    .game {
      width: min(96vw, 700px);
      background: #c0c0c0;
      border: 4px solid #808080;
      border-top-color: #fff;
      border-left-color: #fff;
      padding: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #222;
      text-shadow: 1px 1px #fff;
    }

    .top-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #bdbdbd;
      border: 4px solid #808080;
      border-top-color: #404040;
      border-left-color: #404040;
      padding: 8px 12px;
      margin-bottom: 12px;
    }

    .counter {
      background: #111;
      color: #ff2020;
      font-family: "Courier New", monospace;
      font-size: 28px;
      font-weight: bold;
      min-width: 70px;
      text-align: center;
      padding: 3px 6px;
      border: 2px solid #555;
    }

    .restart {
      width: 52px;
      height: 52px;
      background: #c0c0c0;
      border: 4px solid #fff;
      border-right-color: #555;
      border-bottom-color: #555;
      font-size: 29px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .restart:active {
      border: 4px solid #555;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }

    .board-container {
      background: #808080;
      border: 4px solid #404040;
      border-top-color: #fff;
      border-left-color: #fff;
      padding: 5px;
      overflow: auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      user-select: none;
      touch-action: manipulation;
    }

    /* =========================
       CASES
    ========================= */

    .cell {
      min-width: 0;
      min-height: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #c0c0c0;

      /* TOUJOURS 3px : la dimension ne change jamais */
      border: 3px solid #fff;
      border-right-color: #7b7b7b;
      border-bottom-color: #7b7b7b;

      font-size: clamp(12px, 3vw, 25px);
      font-weight: bold;

      cursor: pointer;
      user-select: none;

      /* Empêche tout changement de dimension */
      width: 100%;
      height: 100%;
    }

    /*
      CASE OUVERTE

      Même épaisseur de bordure que la case fermée.
      La case garde donc exactement la même taille.
    */
    .cell.revealed {
      background: #c0c0c0;

      border: 3px solid #8b8b8b;

      cursor: default;
    }

    .cell.flag {
      color: red;
      font-size: clamp(13px, 3vw, 25px);
    }

    .cell.mine {
      background: #e00000;
      border: 3px solid #8b0000;
    }

    /* COULEURS DES CHIFFRES */

    .number-1 {
      color: #0000ff;
    }

    .number-2 {
      color: #008000;
    }

    .number-3 {
      color: #ff0000;
    }

    .number-4 {
      color: #000080;
    }

    .number-5 {
      color: #800000;
    }

    .number-6 {
      color: #008080;
    }

    .number-7 {
      color: #000000;
    }

    .number-8 {
      color: #808080;
    }

    /* MESSAGE */

    .message {
      text-align: center;
      min-height: 32px;
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .win {
      color: #087b08;
    }

    .lose {
      color: #c00000;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      body {
        align-items: flex-start;
        padding-top: 10px;
      }

      .game {
        width: 98vw;
        padding: 7px;
      }

      .title {
        font-size: 25px;
      }

      .top-panel {
        padding: 5px;
      }

      .counter {
        font-size: 22px;
        min-width: 60px;
      }

      .restart {
        width: 44px;
        height: 44px;
        font-size: 24px;
      }

      .cell {
        border-width: 2px;
      }

      .cell.revealed {
        border-width: 2px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <div class="title">
      💣 Démineur
    </div>

    <div class="top-panel">

      <div class="counter" id="flagCounter">
        000
      </div>

      <button class="restart" id="restart" aria-label="Recommencer">
        🙂
      </button>

      <div class="counter" id="timer">
        000
      </div>

    </div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <div class="message" id="message"></div>

  </div>


<script>

  const ROWS = 15;
  const COLS = 15;

  /*
    Les positions des bombes restent cachées
    dans functions/api/game.js
  */

  const board = document.getElementById("board");
  const message = document.getElementById("message");
  const restartButton = document.getElementById("restart");
  const flagCounter = document.getElementById("flagCounter");
  const timerDisplay = document.getElementById("timer");

  let cells = [];
  let gameOver = false;
  let flags = 0;
  let revealed = 0;
  let timer = 0;
  let timerInterval = null;
  let gameStarted = false;


  /* =========================
     CRÉATION DU PLATEAU
  ========================= */

  function createBoard() {

    board.innerHTML = "";

    cells = [];
    gameOver = false;
    flags = 0;
    revealed = 0;
    timer = 0;
    gameStarted = false;

    clearInterval(timerInterval);

    timerDisplay.textContent = "000";
    flagCounter.textContent = "000";
    message.textContent = "";
    message.className = "message";

    restartButton.textContent = "🙂";

    for (let row = 0; row < ROWS; row++) {

      cells[row] = [];

      for (let col = 0; col < COLS; col++) {

        const cell = document.createElement("div");

        cell.className = "cell";

        cell.dataset.row = row;
        cell.dataset.col = col;

        cell.addEventListener("click", function() {
          handleClick(row, col);
        });

        cell.addEventListener("contextmenu", function(event) {
          event.preventDefault();
          toggleFlag(row, col);
        });

        let pressTimer = null;
        let longPress = false;

        cell.addEventListener("pointerdown", function() {

          longPress = false;

          pressTimer = setTimeout(() => {

            longPress = true;
            toggleFlag(row, col);

          }, 500);

        });

        cell.addEventListener("pointerup", function() {
          clearTimeout(pressTimer);
        });

        cell.addEventListener("pointerleave", function() {
          clearTimeout(pressTimer);
        });

        cells[row][col] = {
          element: cell,
          revealed: false,
          flagged: false
        };

        board.appendChild(cell);
      }
    }
  }


  /* =========================
     TIMER
  ========================= */

  function startTimer() {

    if (gameStarted) return;

    gameStarted = true;

    timerInterval = setInterval(() => {

      timer++;

      if (timer > 999) {
        timer = 999;
      }

      timerDisplay.textContent =
        String(timer).padStart(3, "0");

    }, 1000);
  }


  /* =========================
     CLIC SUR UNE CASE
  ========================= */

  async function handleClick(row, col) {

    if (gameOver) return;

    const cell = cells[row][col];

    if (cell.revealed || cell.flagged) {
      return;
    }

    startTimer();

    restartButton.textContent = "😮";

    try {

      const response = await fetch("/api/game", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          row: row,
          col: col
        })

      });

      if (!response.ok) {
        throw new Error("Erreur serveur");
      }

      const data = await response.json();

      if (data.mine) {

        loseGame(row, col);

        return;
      }

      if (Array.isArray(data.cells)) {

        data.cells.forEach(item => {

          revealCell(
            item.row,
            item.col,
            item.number
          );

        });

      }

      checkWin();

    } catch (error) {

      console.error(error);

      message.textContent =
        "Erreur de connexion au serveur.";

      message.className = "message lose";
    }
  }


  /* =========================
     RÉVÉLER UNE CASE
  ========================= */

  function revealCell(row, col, number) {

    if (
      row < 0 ||
      row >= ROWS ||
      col < 0 ||
      col >= COLS
    ) {
      return;
    }

    const cell = cells[row][col];

    if (cell.revealed) {
      return;
    }

    cell.revealed = true;
    revealed++;

    cell.element.classList.add("revealed");

    cell.element.classList.remove(
      "number-1",
      "number-2",
      "number-3",
      "number-4",
      "number-5",
      "number-6",
      "number-7",
      "number-8"
    );

    if (number > 0) {

      cell.element.textContent = number;

      cell.element.classList.add(
        "number-" + number
      );

    } else {

      cell.element.textContent = "";

    }
  }


  /* =========================
     DRAPEAU
  ========================= */

  function toggleFlag(row, col) {

    if (gameOver) return;

    const cell = cells[row][col];

    if (cell.revealed) {
      return;
    }

    if (cell.flagged) {

      cell.flagged = false;
      flags--;

      cell.element.textContent = "";

      cell.element.classList.remove("flag");

    } else {

      cell.flagged = true;
      flags++;

      cell.element.textContent = "🚩";

      cell.element.classList.add("flag");
    }

    flagCounter.textContent =
      String(flags).padStart(3, "0");
  }


  /* =========================
     DÉFAITE
  ========================= */

  function loseGame(clickedRow, clickedCol) {

    gameOver = true;

    clearInterval(timerInterval);

    restartButton.textContent = "😵";

    message.textContent = "💥 BOOM ! Perdu !";
    message.className = "message lose";

    const clickedCell =
      cells[clickedRow][clickedCol];

    clickedCell.element.textContent = "💣";
    clickedCell.element.classList.add("mine");
  }


  /* =========================
     VICTOIRE
  ========================= */

  function checkWin() {

    const totalCells = ROWS * COLS;

    if (revealed >= totalCells - 31) {

      gameOver = true;

      clearInterval(timerInterval);

      restartButton.textContent = "😎";

      message.textContent =
        "🎉 Bravo ! Tu as gagné !";

      message.className =
        "message win";

      for (let row = 0; row < ROWS; row++) {

        for (let col = 0; col < COLS; col++) {

          const cell = cells[row][col];

          if (!cell.revealed && !cell.flagged) {

            cell.element.textContent = "🚩";
            cell.element.classList.add("flag");

          }
        }
      }
    }
  }


  /* =========================
     RECOMMENCER
  ========================= */

  restartButton.addEventListener(
    "click",
    createBoard
  );


  /* =========================
     LANCEMENT
  ========================= */

  createBoard();

</script>

</body>
</html>
