<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Démineur</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(circle at top, #444 0%, #222 45%, #111 100%);

      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #111;

      padding: 15px;
    }


    /* =====================================
       CONTENEUR PRINCIPAL
    ===================================== */

    .game {

      width: min(96vw, 720px);

      background: #c0c0c0;

      border: 5px solid #808080;

      border-top-color: #ffffff;
      border-left-color: #ffffff;

      padding: 14px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.65);
    }


    /* =====================================
       TITRE
    ===================================== */

    .title {

      text-align: center;

      font-size: clamp(26px, 5vw, 42px);

      font-weight: bold;

      margin-bottom: 14px;

      color: #222;

      text-shadow:
        2px 2px #ffffff;
    }


    /* =====================================
       PANNEAU DU HAUT
    ===================================== */

    .top-panel {

      display: flex;

      align-items: center;

      justify-content: space-between;

      background: #bdbdbd;

      border: 5px solid #808080;

      border-top-color: #404040;
      border-left-color: #404040;

      padding: 10px 14px;

      margin-bottom: 14px;
    }


    /* =====================================
       COMPTEURS
    ===================================== */

    .counter {

      background: #111111;

      color: #ff2020;

      font-family: "Courier New", monospace;

      font-size: clamp(20px, 5vw, 32px);

      font-weight: bold;

      min-width: 78px;

      text-align: center;

      padding: 5px 8px;

      border: 3px solid #555;

      box-shadow:
        inset 0 0 0 2px #222;
    }


    /* =====================================
       BOUTON RECOMMENCER
    ===================================== */

    .restart {

      width: 58px;
      height: 58px;

      background: #c0c0c0;

      border: 5px solid #ffffff;

      border-right-color: #555555;
      border-bottom-color: #555555;

      font-size: 32px;

      cursor: pointer;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 0;

      user-select: none;
    }

    .restart:active {

      border: 5px solid #555555;

      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
    }


    /* =====================================
       CADRE DU PLATEAU
    ===================================== */

    .board-container {

      background: #808080;

      border: 5px solid #404040;

      border-top-color: #ffffff;
      border-left-color: #ffffff;

      padding: 7px;

      overflow: hidden;
    }


    /* =====================================
       PLATEAU 15 x 15
    ===================================== */

    .board {

      display: grid;

      grid-template-columns:
        repeat(15, minmax(0, 1fr));

      grid-template-rows:
        repeat(15, minmax(0, 1fr));

      width: 100%;

      aspect-ratio: 1 / 1;

      user-select: none;

      touch-action: manipulation;
    }


    /* =====================================
       CASES

       IMPORTANT :
       Toutes les cases ont exactement
       la même épaisseur de bordure.

       C'est ce qui empêche les cases
       de changer de dimension.
    ===================================== */

    .cell {

      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      background: #c0c0c0;

      /*
        TOUJOURS 3px.
        On ne change plus cette valeur
        lorsque la case est ouverte.
      */

      border: 3px solid #ffffff;

      border-right-color: #7b7b7b;
      border-bottom-color: #7b7b7b;

      font-size: clamp(12px, 3vw, 25px);

      font-weight: bold;

      line-height: 1;

      cursor: pointer;

      user-select: none;

      overflow: hidden;
    }


    /* =====================================
       CASE OUVERTE

       La bordure reste à 3px.
       Seules les COULEURS changent.
    ===================================== */

    .cell.revealed {

      background: #c0c0c0;

      /*
        Même épaisseur que les cases fermées
      */

      border: 3px solid #8b8b8b;

      cursor: default;
    }


    /* =====================================
       DRAPEAU
    ===================================== */

    .cell.flag {

      color: #ff0000;

      font-size: clamp(13px, 3vw, 25px);

      line-height: 1;
    }


    /* =====================================
       MINE
    ===================================== */

    .cell.mine {

      background: #e00000;

      border: 3px solid #8b0000;

      color: #000000;
    }


    /* =====================================
       COULEURS DES CHIFFRES
    ===================================== */

    .number-1 {
      color: #0000ff;
    }

    .number-2 {
      color: #008000;
    }

    .number-3 {
      color: #ff0000;
    }

    .number-4 {
      color: #000080;
    }

    .number-5 {
      color: #800000;
    }

    .number-6 {
      color: #008080;
    }

    .number-7 {
      color: #000000;
    }

    .number-8 {
      color: #808080;
    }


    /* =====================================
       MESSAGE
    ===================================== */

    .message {

      text-align: center;

      min-height: 32px;

      margin-top: 12px;

      font-size: 20px;

      font-weight: bold;
    }

    .win {
      color: #087b08;
    }

    .lose {
      color: #c00000;
    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 500px) {

      body {

        align-items: flex-start;

        padding-top: 10px;
        padding-left: 5px;
        padding-right: 5px;
      }


      .game {

        width: 99vw;

        padding: 7px;

        border-width: 4px;
      }


      .title {

        font-size: 25px;

        margin-bottom: 9px;
      }


      .top-panel {

        padding: 5px;

        border-width: 4px;

        margin-bottom: 9px;
      }


      .counter {

        font-size: 22px;

        min-width: 60px;

        padding: 4px;
      }


      .restart {

        width: 46px;
        height: 46px;

        font-size: 25px;

        border-width: 4px;
      }


      .board-container {

        border-width: 4px;

        padding: 5px;
      }


      /*
        IMPORTANT :
        Même bordure pour les cases
        ouvertes et fermées sur mobile.
      */

      .cell,
      .cell.revealed,
      .cell.mine {

        border-width: 2px;
      }

      .cell {

        font-size: clamp(11px, 3vw, 20px);
      }

      .cell.flag {

        font-size: clamp(12px, 3vw, 21px);
      }

    }

  </style>

</head>


<body>


  <div class="game">


    <!-- TITRE -->

    <div class="title">
      💣 Démineur
    </div>


    <!-- PANNEAU DU HAUT -->

    <div class="top-panel">

      <div class="counter" id="flagCounter">
        000
      </div>


      <button
        class="restart"
        id="restart"
        aria-label="Recommencer"
      >
        🙂
      </button>


      <div class="counter" id="timer">
        000
      </div>

    </div>


    <!-- PLATEAU -->

    <div class="board-container">

      <div
        class="board"
        id="board"
      ></div>

    </div>


    <!-- MESSAGE -->

    <div
      class="message"
      id="message"
    ></div>


  </div>



<script>


  /* =====================================
     CONFIGURATION
  ===================================== */

  const ROWS = 15;
  const COLS = 15;


  /*
    IMPORTANT :

    Les positions des mines NE SONT PAS
    présentes dans ce fichier.

    Elles restent dans :

    functions/api/game.js

    Le joueur ne peut donc pas voir
    leur position dans le HTML.
  */


  const board =
    document.getElementById("board");

  const message =
    document.getElementById("message");

  const restartButton =
    document.getElementById("restart");

  const flagCounter =
    document.getElementById("flagCounter");

  const timerDisplay =
    document.getElementById("timer");


  let cells = [];

  let gameOver = false;

  let flags = 0;

  let revealed = 0;

  let timer = 0;

  let timerInterval = null;

  let gameStarted = false;



  /* =====================================
     CRÉATION DU PLATEAU
  ===================================== */

  function createBoard() {

    board.innerHTML = "";

    cells = [];

    gameOver = false;

    flags = 0;

    revealed = 0;

    timer = 0;

    gameStarted = false;


    clearInterval(timerInterval);


    timerDisplay.textContent = "000";

    flagCounter.textContent = "000";


    message.textContent = "";

    message.className = "message";


    restartButton.textContent = "🙂";


    for (
      let row = 0;
      row < ROWS;
      row++
    ) {


      cells[row] = [];


      for (
        let col = 0;
        col < COLS;
        col++
      ) {


        const cell =
          document.createElement("div");


        cell.className = "cell";


        cell.dataset.row = row;

        cell.dataset.col = col;



        /* =========================
           CLIC COURT
        ========================= */

        cell.addEventListener(
          "click",
          function() {

            handleClick(row, col);

          }
        );



        /* =========================
           CLIC DROIT
        ========================= */

        cell.addEventListener(
          "contextmenu",
          function(event) {

            event.preventDefault();

            toggleFlag(row, col);

          }
        );



        /* =========================
           APPUI LONG MOBILE
        ========================= */

        let pressTimer = null;

        let longPress = false;


        cell.addEventListener(
          "pointerdown",
          function() {

            longPress = false;


            pressTimer = setTimeout(
              () => {

                longPress = true;

                toggleFlag(row, col);

              },
              500
            );

          }
        );


        cell.addEventListener(
          "pointerup",
          function() {

            clearTimeout(pressTimer);

          }
        );


        cell.addEventListener(
          "pointerleave",
          function() {

            clearTimeout(pressTimer);

          }
        );


        cell.addEventListener(
          "pointercancel",
          function() {

            clearTimeout(pressTimer);

          }
        );



        cells[row][col] = {

          element: cell,

          revealed: false,

          flagged: false

        };


        board.appendChild(cell);

      }

    }

  }



  /* =====================================
     TIMER
  ===================================== */

  function startTimer() {


    if (gameStarted) {

      return;

    }


    gameStarted = true;


    timerInterval =
      setInterval(
        () => {


          timer++;


          if (timer > 999) {

            timer = 999;

          }


          timerDisplay.textContent =
            String(timer).padStart(3, "0");


        },
        1000
      );

  }



  /* =====================================
     CLIC SUR UNE CASE
  ===================================== */

  async function handleClick(row, col) {


    if (gameOver) {

      return;

    }


    const cell =
      cells[row][col];


    if (
      cell.revealed ||
      cell.flagged
    ) {

      return;

    }


    startTimer();


    restartButton.textContent = "😮";


    try {


      const response =
        await fetch(
          "/api/game",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              row: row,

              col: col

            })

          }
        );


      if (!response.ok) {

        throw new Error(
          "Erreur serveur"
        );

      }


      const data =
        await response.json();



      /* =========================
         BOMBE
      ========================= */

      if (data.mine) {

        loseGame(row, col);

        return;

      }



      /* =========================
         ZONE SÛRE
      ========================= */

      if (
        Array.isArray(data.cells)
      ) {


        data.cells.forEach(
          item => {


            revealCell(

              item.row,

              item.col,

              item.number

            );

          }
        );

      }


      checkWin();


    }
    catch (error) {


      console.error(error);


      message.textContent =
        "Erreur de connexion au serveur.";


      message.className =
        "message lose";

    }

  }



  /* =====================================
     RÉVÉLER UNE CASE
  ===================================== */

  function revealCell(
    row,
    col,
    number
  ) {


    if (

      row < 0 ||
      row >= ROWS ||
      col < 0 ||
      col >= COLS

    ) {

      return;

    }


    const cell =
      cells[row][col];


    if (cell.revealed) {

      return;

    }


    cell.revealed = true;


    revealed++;


    /*
      On enlève le drapeau
      s'il y en avait un.
    */

    cell.flagged = false;


    cell.element.classList.add(
      "revealed"
    );


    cell.element.classList.remove(
      "flag",
      "number-1",
      "number-2",
      "number-3",
      "number-4",
      "number-5",
      "number-6",
      "number-7",
      "number-8"
    );


    cell.element.textContent = "";


    if (number > 0) {


      cell.element.textContent =
        number;


      cell.element.classList.add(
        "number-" + number
      );

    }

  }



  /* =====================================
     DRAPEAU
  ===================================== */

  function toggleFlag(row, col) {


    if (gameOver) {

      return;

    }


    const cell =
      cells[row][col];


    if (cell.revealed) {

      return;

    }



    if (cell.flagged) {


      cell.flagged = false;

      flags--;


      cell.element.textContent = "";


      cell.element.classList.remove(
        "flag"
      );


    }
    else {


      cell.flagged = true;

      flags++;


      cell.element.textContent = "🚩";


      cell.element.classList.add(
        "flag"
      );

    }



    /*
      On affiche uniquement
      le nombre de drapeaux posés.

      Le nombre total de bombes
      n'est JAMAIS affiché.
    */

    flagCounter.textContent =
      String(flags).padStart(3, "0");

  }



  /* =====================================
     DÉFAITE
  ===================================== */

  function loseGame(
    clickedRow,
    clickedCol
  ) {


    gameOver = true;


    clearInterval(timerInterval);


    restartButton.textContent = "😵";


    message.textContent =
      "💥 BOOM ! Perdu !";


    message.className =
      "message lose";


    const clickedCell =
      cells[clickedRow][clickedCol];


    clickedCell.element.textContent =
      "💣";


    clickedCell.element.classList.add(
      "mine"
    );

  }



  /* =====================================
     VICTOIRE
  ===================================== */

  function checkWin() {


    /*
      15 x 15 = 225 cases.

      31 bombes sont cachées côté serveur.

      On ne les affiche jamais.
    */

    const totalCells =
      ROWS * COLS;


    if (
      revealed >=
      totalCells - 31
    ) {


      gameOver = true;


      clearInterval(timerInterval);


      restartButton.textContent = "😎";


      message.textContent =
        "🎉 Bravo ! Tu as gagné !";


      message.className =
        "message win";



      /*
        On affiche automatiquement
        les drapeaux sur les cases restantes.
      */

      for (
        let row = 0;
        row < ROWS;
        row++
      ) {


        for (
          let col = 0;
          col < COLS;
          col++
        ) {


          const cell =
            cells[row][col];


          if (
            !cell.revealed &&
            !cell.flagged
          ) {


            cell.element.textContent =
              "🚩";


            cell.element.classList.add(
              "flag"
            );

          }

        }

      }

    }

  }



  /* =====================================
     BOUTON RECOMMENCER
  ===================================== */

  restartButton.addEventListener(
    "click",
    createBoard
  );



  /* =====================================
     LANCEMENT DU JEU
  ===================================== */

  createBoard();


</script>


</body>
</html>
