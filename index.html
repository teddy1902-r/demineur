<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démineur</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;background:radial-gradient(circle at top,#444 0%,#222 45%,#111 100%);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;color:#111;padding:15px}
    .game{width:min(96vw,720px);background:#c0c0c0;border:5px solid #808080;border-top-color:#fff;border-left-color:#fff;padding:14px;box-shadow:0 10px 35px rgba(0,0,0,.65)}
    .title{text-align:center;font-size:clamp(26px,5vw,42px);font-weight:bold;margin-bottom:14px;color:#222;text-shadow:2px 2px #fff}
    .top-panel{display:flex;align-items:center;justify-content:space-between;background:#bdbdbd;border:5px solid #808080;border-top-color:#404040;border-left-color:#404040;padding:10px 14px;margin-bottom:14px}
    .counter{background:#111;color:#ff2020;font-family:"Courier New",monospace;font-size:clamp(20px,5vw,32px);font-weight:bold;min-width:78px;text-align:center;padding:5px 8px;border:3px solid #555;box-shadow:inset 0 0 0 2px #222}
    .restart{width:58px;height:58px;background:#c0c0c0;border:5px solid #fff;border-right-color:#555;border-bottom-color:#555;font-size:32px;cursor:pointer;display:flex;justify-content:center;align-items:center;padding:0;user-select:none}
    .restart:active{border:5px solid #555;border-right-color:#fff;border-bottom-color:#fff}
    .board-container{background:#808080;border:5px solid #404040;border-top-color:#fff;border-left-color:#fff;padding:7px;overflow:hidden}
    .board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));width:100%;aspect-ratio:1/1;user-select:none;touch-action:manipulation}
    .cell{width:100%;height:100%;min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;background:#c0c0c0;border:3px solid #fff;border-right-color:#7b7b7b;border-bottom-color:#7b7b7b;font-size:clamp(12px,3vw,25px);font-weight:bold;line-height:1;cursor:pointer;user-select:none;overflow:hidden}
    .cell.revealed{background:#c0c0c0;border:3px solid #8b8b8b;cursor:default}
    .cell.flag{color:#f00;font-size:clamp(13px,3vw,25px)}
    .cell.mine{background:#e00000;border:3px solid #8b0000;color:#000}
    .number-1{color:#00f}.number-2{color:#008000}.number-3{color:#f00}.number-4{color:#000080}.number-5{color:#800000}.number-6{color:#008080}.number-7{color:#000}.number-8{color:#808080}
    .message{text-align:center;min-height:32px;margin-top:12px;font-size:20px;font-weight:bold}.win{color:#087b08}.lose{color:#c00000}
    @media(max-width:500px){body{align-items:flex-start;padding:10px 5px 0}.game{width:99vw;padding:7px;border-width:4px}.title{font-size:25px;margin-bottom:9px}.top-panel{padding:5px;border-width:4px;margin-bottom:9px}.counter{font-size:22px;min-width:60px;padding:4px}.restart{width:46px;height:46px;font-size:25px;border-width:4px}.board-container{border-width:4px;padding:5px}.cell,.cell.revealed,.cell.mine{border-width:2px}.cell{font-size:clamp(11px,3vw,20px)}.cell.flag{font-size:clamp(12px,3vw,21px)}}
  </style>
</head>
<body>
  <div class="game">
    <div class="title">💣 Démineur</div>
    <div class="top-panel">
      <div class="counter" id="flagCounter">000</div>
      <button class="restart" id="restart" aria-label="Recommencer">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="board-container"><div class="board" id="board"></div></div>
    <div class="message" id="message"></div>
  </div>
<script>
const ROWS=15,COLS=15;
const board=document.getElementById('board');
const message=document.getElementById('message');
const restartButton=document.getElementById('restart');
const flagCounter=document.getElementById('flagCounter');
const timerDisplay=document.getElementById('timer');
let cells=[],gameOver=false,flags=0,revealed=0,timer=0,timerInterval=null,gameStarted=false,gameId='';

function newGameId(){
  return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}-${Math.random()}`;
}

function createBoard(){
  board.innerHTML=''; cells=[]; gameOver=false; flags=0; revealed=0; timer=0; gameStarted=false; gameId=newGameId();
  clearInterval(timerInterval); timerDisplay.textContent='000'; flagCounter.textContent='000'; message.textContent=''; message.className='message'; restartButton.textContent='🙂';
  for(let row=0;row<ROWS;row++){
    cells[row]=[];
    for(let col=0;col<COLS;col++){
      const el=document.createElement('div'); el.className='cell'; el.dataset.row=row; el.dataset.col=col;
      const cell={element:el,revealed:false,flagged:false}; cells[row][col]=cell;
      el.addEventListener('click',()=>handleClick(row,col));
      el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(row,col)});
      let pressTimer=null;
      el.addEventListener('pointerdown',()=>{pressTimer=setTimeout(()=>toggleFlag(row,col),500)});
      ['pointerup','pointerleave','pointercancel'].forEach(type=>el.addEventListener(type,()=>clearTimeout(pressTimer)));
      board.appendChild(el);
    }
  }
}

function startTimer(){
  if(gameStarted)return; gameStarted=true;
  timerInterval=setInterval(()=>{timer=Math.min(999,timer+1);timerDisplay.textContent=String(timer).padStart(3,'0')},1000);
}

function revealedKeys(){
  const out=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(cells[r][c].revealed)out.push(`${r},${c}`);
  return out;
}

async function handleClick(row,col){
  if(gameOver)return;
  const cell=cells[row][col]; if(cell.revealed||cell.flagged)return;
  startTimer(); restartButton.textContent='😮';
  try{
    const response=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({row,col,gameId,revealed:revealedKeys()})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Erreur serveur');
    if(data.mine){loseGame(row,col);return;}
    (data.cells||[]).forEach(item=>revealCell(item.row,item.col,item.number));
    if(data.won)winGame(data.mineCount);
    else restartButton.textContent='🙂';
  }catch(error){message.textContent='Configuration du jeu indisponible.';message.className='message lose';restartButton.textContent='🙂';}
}

function revealCell(row,col,number){
  const cell=cells[row][col]; if(!cell||cell.revealed)return;
  cell.revealed=true; revealed++; cell.element.classList.remove('flag'); cell.element.classList.add('revealed'); cell.element.textContent='';
  if(number>0){cell.element.textContent=number;cell.element.classList.add(`number-${number}`)}
}

function toggleFlag(row,col){
  if(gameOver)return; const cell=cells[row][col]; if(cell.revealed)return;
  cell.flagged=!cell.flagged; cell.element.classList.toggle('flag',cell.flagged); cell.element.textContent=cell.flagged?'🚩':''; flags+=cell.flagged?1:-1; flagCounter.textContent=String(Math.max(0,flags)).padStart(3,'0');
}

function loseGame(row,col){
  gameOver=true; clearInterval(timerInterval); restartButton.textContent='😵';
  const cell=cells[row][col]; cell.revealed=true; cell.element.classList.add('revealed','mine'); cell.element.textContent='💣';
  message.textContent='💥 Game Over !'; message.className='message lose';
}

function winGame(mineCount){
  gameOver=true; clearInterval(timerInterval); restartButton.textContent='😎';
  message.textContent=`🎉 Bravo ! Il y avait ${mineCount} bombes.`; message.className='message win';
}

restartButton.addEventListener('click',createBoard);
createBoard();
</script>
</body>
</html>
