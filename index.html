<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Démineur</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 10px 40px;
    color: white;
}

.game {
    width: min(95vw, 650px);
}

/* TITRE */
h1 {
    text-align: center;
    margin: 5px 0 8px;
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 800;
    color: #111;
    text-shadow:
        2px 2px 0 #fff,
        -1px -1px 0 #fff;
}

.subtitle {
    text-align: center;
    color: #222;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* PANNEAU */
.top-panel {
    background: #bdbdbd;
    border: 8px solid #4b4b4b;
    padding: 12px;
    margin-bottom: 18px;
}

.info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

/* COMPTEUR */
.counter {
    background: #111;
    border: 5px solid #555;
    color: #ff3030;
    font-family: "Courier New", monospace;
    font-size: clamp(22px, 6vw, 34px);
    font-weight: bold;
    min-width: 95px;
    padding: 7px 8px;
    text-align: center;
    letter-spacing: 2px;
}

/* BOUTON */
.restart {
    width: 65px;
    height: 65px;
    border: 8px solid #666;
    border-top-color: white;
    border-left-color: white;
    border-right-color: #555;
    border-bottom-color: #555;
    background: #bdbdbd;
    font-size: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.restart:active {
    border-top-color: #555;
    border-left-color: #555;
    border-right-color: white;
    border-bottom-color: white;
}

/* PLATEAU */
.board-container {
    background: #bdbdbd;
    border: 9px solid #4b4b4b;
    padding: 10px;
}

/*
   IMPORTANT :
   Le plateau utilise exactement 15 colonnes.
   Chaque case garde exactement la même taille.
*/
.board {
    display: grid;
    grid-template-columns: repeat(15, minmax(0, 1fr));
    width: 100%;
    aspect-ratio: 1 / 1;
}

/* CASE */
.cell {
    width: 100%;
    aspect-ratio: 1 / 1;

    /* Même bordure dans TOUS les états */
    border: 1px solid #777;

    background: #999;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: clamp(12px, 3vw, 22px);
    font-weight: bold;

    padding: 0;
    margin: 0;

    /* Aucun changement de taille */
    transform: none !important;
    box-shadow: none;
}

/* CASE FERMÉE */
.cell.hidden {
    background: #999;
    border: 1px solid #777;
}

/* CASE OUVERTE */
.cell.revealed {
    background: #c0c0c0;
    border: 1px solid #777;

    /* IMPORTANT : aucun effet de relief */
    box-shadow: none;
    transform: none;
}

/* DRAPEAU */
.cell.flagged {
    background: #999;
    color: #e00000;
}

/* BOMBE */
.cell.mine {
    background: #d9534f;
    color: white;
}

/* COULEURS DES CHIFFRES */
.number-1 {
    color: #0000cc;
}

.number-2 {
    color: #008000;
}

.number-3 {
    color: #cc0000;
}

.number-4 {
    color: #000080;
}

.number-5 {
    color: #800000;
}

.number-6 {
    color: #008080;
}

.number-7 {
    color: #000000;
}

.number-8 {
    color: #666666;
}

/* MESSAGE */
.message {
    text-align: center;
    min-height: 32px;
    margin-top: 12px;
    font-size: 20px;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 500px) {

    body {
        padding: 10px 5px 30px;
    }

    .game {
        width: 98vw;
    }

    .top-panel {
        border-width: 6px;
        padding: 8px;
    }

    .board-container {
        border-width: 6px;
        padding: 6px;
    }

    .counter {
        min-width: 78px;
        font-size: 23px;
        padding: 5px;
    }

    .restart {
        width: 55px;
        height: 55px;
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>💣 Démineur</h1>

    <div class="subtitle">
        15 × 15
    </div>

    <div class="top-panel">

        <div class="info">

            <div class="counter" id="counter">
                000
            </div>

            <button class="restart" id="restart">
                😮
            </button>

            <div class="counter" id="timer">
                000
            </div>

        </div>

    </div>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <div class="message" id="message"></div>

</div>

<script>
const ROWS = 15;
const COLS = 15;
const TOTAL_MINES = 31;

const board = document.getElementById("board");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const timerDisplay = document.getElementById("timer");
const restartButton = document.getElementById("restart");

let cells = [];
let flags = new Set();
let revealed = new Set();

let gameOver = false;
let startTime = null;
let timerInterval = null;


/* =========================
   CRÉATION DU PLATEAU
========================= */

function createBoard() {

    board.innerHTML = "";

    cells = [];

    for (let row = 0; row < ROWS; row++) {

        cells[row] = [];

        for (let col = 0; col < COLS; col++) {

            const cell = document.createElement("div");

            cell.className = "cell hidden";

            cell.dataset.row = row;
            cell.dataset.col = col;

            board.appendChild(cell);

            cells[row][col] = cell;

            setupCell(cell, row, col);
        }
    }

    updateCounter();
}


/* =========================
   CLIC / APPUI LONG
========================= */

function setupCell(cell, row, col) {

    let pressTimer = null;
    let longPress = false;

    cell.addEventListener("pointerdown", function(e) {

        if (gameOver) return;

        longPress = false;

        pressTimer = setTimeout(() => {

            longPress = true;

            toggleFlag(row, col);

        }, 500);

    });

    cell.addEventListener("pointerup", function() {

        clearTimeout(pressTimer);

        if (!longPress && !gameOver) {

            revealCell(row, col);
        }

    });

    cell.addEventListener("pointerleave", function() {

        clearTimeout(pressTimer);

    });

    cell.addEventListener("contextmenu", function(e) {

        e.preventDefault();

    });
}


/* =========================
   REVELER UNE CASE
========================= */

async function revealCell(row, col) {

    if (gameOver) return;

    const key = `${row},${col}`;

    if (revealed.has(key)) return;

    if (flags.has(key)) return;

    if (!startTime) {

        startTime = Date.now();

        timerInterval = setInterval(updateTimer, 1000);
    }

    try {

        const response = await fetch("/api/game", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                row: row,
                col: col
            })

        });

        const data = await response.json();

        if (data.mine) {

            cells[row][col].classList.remove("hidden");
            cells[row][col].classList.add("mine");
            cells[row][col].textContent = "💣";

            gameOver = true;

            clearInterval(timerInterval);

            message.textContent = "💥 Perdu !";

            restartButton.textContent = "😵";

            return;
        }

        if (data.cells) {

            data.cells.forEach(item => {

                revealOneCell(
                    item.row,
                    item.col,
                    item.number
                );

            });
        }

        checkWin();

    } catch (error) {

        console.error(error);

        message.textContent =
            "Erreur de connexion au serveur.";
    }
}


/* =========================
   AFFICHER UNE CASE
========================= */

function revealOneCell(row, col, number) {

    const key = `${row},${col}`;

    if (revealed.has(key)) return;

    revealed.add(key);

    const cell = cells[row][col];

    cell.classList.remove("hidden");
    cell.classList.add("revealed");

    cell.textContent = "";

    if (number > 0) {

        cell.textContent = number;

        cell.classList.add(`number-${number}`);
    }
}


/* =========================
   DRAPEAU
========================= */

function toggleFlag(row, col) {

    const key = `${row},${col}`;

    if (revealed.has(key)) return;

    const cell = cells[row][col];

    if (flags.has(key)) {

        flags.delete(key);

        cell.classList.remove("flagged");

        cell.textContent = "";

    } else {

        flags.add(key);

        cell.classList.add("flagged");

        cell.textContent = "🚩";
    }

    updateCounter();
}


/* =========================
   COMPTEUR
========================= */

function updateCounter() {

    const remaining = TOTAL_MINES - flags.size;

    counter.textContent =
        String(Math.max(0, remaining)).padStart(3, "0");
}


/* =========================
   CHRONOMÈTRE
========================= */

function updateTimer() {

    if (!startTime) return;

    const seconds =
        Math.floor((Date.now() - startTime) / 1000);

    timerDisplay.textContent =
        String(Math.min(seconds, 999)).padStart(3, "0");
}


/* =========================
   VICTOIRE
========================= */

function checkWin() {

    const totalSafeCells =
        ROWS * COLS - TOTAL_MINES;

    if (revealed.size >= totalSafeCells) {

        gameOver = true;

        clearInterval(timerInterval);

        message.textContent = "🎉 Gagné !";

        restartButton.textContent = "😎";
    }
}


/* =========================
   RECOMMENCER
========================= */

restartButton.addEventListener("click", function() {

    gameOver = false;

    flags.clear();
    revealed.clear();

    startTime = null;

    clearInterval(timerInterval);

    timerInterval = null;

    timerDisplay.textContent = "000";

    message.textContent = "";

    restartButton.textContent = "😮";

    createBoard();
});


/* =========================
   LANCEMENT
========================= */

createBoard();

</script>

</body>
</html>
